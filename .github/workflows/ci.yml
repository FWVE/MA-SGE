name: Framework checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: ruff check src tests
      - run: python -m mypy src/masge
      - run: python -m build
      - name: Verify installed wheel outside the source tree
        run: |
          python -m venv --system-site-packages /tmp/masge-wheel
          /tmp/masge-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/masge-wheel/bin/python -c "from masge import Solver, load_graph"
          /tmp/masge-wheel/bin/masge --help
